<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>qwen watch</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#EDF0F3;--panel:#FFFFFF;--sunk:#E3E8EE;--ink:#18202B;--muted:#5B6676;--line:#D5DBE2;
  --run:#2F6FED;--ok:#17905F;--bad:#D9484F;--warn:#B87708;--warn-bg:#FBF1DD;--floor:#C9D1DB;
  --r-lg:14px;--r-sm:8px;
  /* the inks: the status colours darkened (light) or lifted (dark) for TEXT on the
     tinted chips, where the plain colours fall under 4.5:1 */
  --run-ink:#2353B8;--ok-ink:#11734B;--warn-ink:#875700;--bad-ink:#B3262E;
  --test-ink:#A8306F;--mark-ink:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F141A;--panel:#171D25;--sunk:#1E2630;--ink:#E4E9F0;--muted:#93A0B1;--line:#263040;
  --run:#6A9BFF;--ok:#3CC58A;--bad:#F06A70;--warn:#F0B04A;--warn-bg:#2A2214;--floor:#2C3644;
  --run-ink:#8DB3FF;--ok-ink:#5AD29D;--warn-ink:#F3BF66;--bad-ink:#F58C91;
  --test-ink:#EE8DBF;--mark-ink:#0F141A;}}
:root[data-theme="dark"]{
  --paper:#0F141A;--panel:#171D25;--sunk:#1E2630;--ink:#E4E9F0;--muted:#93A0B1;--line:#263040;
  --run:#6A9BFF;--ok:#3CC58A;--bad:#F06A70;--warn:#F0B04A;--warn-bg:#2A2214;--floor:#2C3644;
  --run-ink:#8DB3FF;--ok-ink:#5AD29D;--warn-ink:#F3BF66;--bad-ink:#F58C91;
  --test-ink:#EE8DBF;--mark-ink:#0F141A;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
main{max-width:880px;margin:0 auto;padding:16px 16px 48px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--run);outline-offset:2px;border-radius:6px}
/* one quiet live region for screen readers: the announcements the poll must never make
   (timers, every re-render) stay out of it -- only the real transitions of finding 1 */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}
.pulse{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--run);box-shadow:0 0 0 0 var(--run);animation:ping 2s infinite}
.dot.stale{background:var(--bad)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 55%,transparent)}
  70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* the crew floor: the one bold element */
.floor{position:relative;background:var(--panel);border-radius:var(--r-lg);padding:14px 14px 0;
  margin-bottom:22px;overflow:hidden}
.floor h1{font-size:22px;line-height:1.25;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
.floor p{margin:0;color:var(--muted);font-size:14px}
.crew{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding:14px 2px 0;
  min-height:104px;scrollbar-width:none;border-bottom:3px solid var(--floor)}
.crew::-webkit-scrollbar{display:none}
.mate{flex:0 0 auto;width:64px;text-align:center;font-size:11px;color:var(--muted);
  text-decoration:none;padding-bottom:4px}
.mate svg{width:58px;height:58px;display:block;margin:0 auto}
.mate span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the crew strip shows 16 robots at most: the rest count into this chip */
.mate.chip{padding-bottom:18px;font-size:13px}
.crew .empty{color:var(--muted);font-size:14px;padding:0 0 18px}

/* the Active agents roll under the crew strip: one compact row per running agent,
   sixteen at most, then a link to the busiest run. One line on the desktop; on a
   phone each row is two -- robot, name and mood, then run, time and context -- and
   nothing scrolls sideways (the mood text wraps on word boundaries) */
.agents{list-style:none;margin:0 0 10px;padding:0;background:var(--panel);
  border-radius:var(--r-sm)}
.agents li{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;
  padding:8px 12px;border-top:1px solid var(--line);font-size:13px;min-width:0}
.agents li:first-child{border-top:0}
.agents li.attn{background:var(--warn-bg);box-shadow:inset 3px 0 var(--warn)}
.agents .a1{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-width:0;flex:1 1 auto}
.agents .a1 svg{width:26px;height:26px;flex:0 0 auto}
.agents .a1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agents .a1 .role,.agents .a1 .rnd{color:var(--muted);font-size:12px;flex:0 0 auto}
.agents .a1 .mood{color:var(--muted);min-width:0;overflow-wrap:break-word}
.agents .atime,.agents .actx{white-space:nowrap}
.agents .a2{display:flex;align-items:baseline;gap:10px;margin-left:auto;color:var(--muted);min-width:0;max-width:100%}
.agents .arun{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agents .atime.over{color:var(--warn-ink);font-weight:600}
.agents .actx.hot{color:var(--warn-ink);font-weight:600}
.agents .am{color:var(--muted)}

/* sections */
h2{font-size:15px;font-weight:650;margin:26px 0 10px;display:flex;gap:8px;align-items:baseline}
h2 small{font-weight:400;color:var(--muted);font-size:13px}
/* a section's title with its control beside it -- the button is a SIBLING of the h2,
   never inside it (an interactive element inside a heading is no heading link) */
.sec-head{display:flex;align-items:baseline;justify-content:space-between}

/* running run cards */
.run{display:grid;grid-template-columns:52px 1fr;gap:4px 12px;background:var(--panel);
  border-radius:var(--r-lg);padding:14px;margin-bottom:10px;text-decoration:none;
  border:1px solid transparent;transition:border-color .15s}
.run:hover{border-color:var(--line)}
.run svg{width:52px;height:52px;grid-row:span 3}
.run .title{font-weight:600;line-height:1.3;overflow-wrap:break-word}
.run .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.run .meter{grid-column:2}
.kind{font-size:12px;font-weight:600;color:var(--muted)}
.flag{color:var(--warn-ink);font-weight:600}

.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--run);transition:width .6s ease}
.bar.ok i{background:var(--ok)} .bar.bad i{background:var(--bad)}
.bar.hot i{background:var(--warn)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}

/* finished list: rows, not cards -- a <ul> of <li class="row">, each one a link and a
   hide button side by side (a button inside a link is invalid HTML and untabbable) */
.done-list{background:var(--panel);border-radius:var(--r-lg);overflow:hidden;
  list-style:none;margin:0;padding:0}
.row{position:relative;border-top:1px solid var(--line);padding-right:48px}
.row:first-child{border-top:0}
.row-link{display:grid;grid-template-columns:20px 1fr;gap:2px 10px;align-items:center;
  padding:11px 14px;text-decoration:none}
/* the list clips its corners; pull the ring inside so it is never the clipped part */
.row-link:focus-visible{outline:2px solid var(--run);outline-offset:-2px}
.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{grid-column:2;font-size:13px;color:var(--muted)}
.x-btn{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.x-btn:hover{background:var(--sunk);color:var(--ink)}
.clear{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:10px 12px;min-height:44px;border-radius:6px}
.clear:hover{background:var(--panel);color:var(--ink)}
.mark{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--mark-ink);font-size:11px;font-weight:700}
.mark.ok{background:var(--ok)} .mark.bad{background:var(--bad)} .mark.gone{background:var(--muted)}

/* run view */
.back{display:inline-block;font-size:14px;color:var(--muted);text-decoration:none;margin:-6px 0 4px;padding:10px 12px 10px 0}
.back:hover{color:var(--ink)}
/* what the run is doing this minute, under its goal: the one line to read first */
.now{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:6px 0 2px;font-size:15px}
.now .ph{font-weight:650}
.now small{color:var(--muted);font-size:13px}
.hero{background:var(--panel);border-radius:var(--r-lg);padding:16px;display:grid;
  grid-template-columns:64px 1fr;gap:4px 14px}
.hero svg{width:64px;height:64px;grid-row:span 2}
.hero h1{font-size:20px;line-height:1.3;margin:0;font-weight:650;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero.full h1{display:block;overflow:visible}
.hero .stat{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.hero .stat b{color:var(--ink);font-weight:600}
.hero .meter{grid-column:1/-1}
.pill{font-size:12px;font-weight:650;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.running{color:var(--run-ink)} .pill.ended{color:var(--ok-ink)} .pill.failed,.pill.killed{color:var(--bad-ink)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
/* the phases are a sequence: one rail runs through their status marks, showing
   through the gaps between the cards (and through the dashed placeholders) */
.phases{position:relative}
.phases::before{content:"";position:absolute;left:22px;top:22px;bottom:22px;width:2px;background:var(--line);border-radius:1px}
.phases .wave{position:relative}
.wave.live{box-shadow:inset 3px 0 0 var(--run)}
.ph-head .mark,.ph-head .spin{position:relative;z-index:1;box-shadow:0 0 0 3px var(--panel)}
.wave.planned .mark{box-shadow:0 0 0 3px var(--paper)}
/* agents still waiting for a seat: one quiet row of small sleepers, not a tile each */
.queue{margin-top:10px;padding:8px 4px 2px;border-top:1px solid var(--line)}
.queue p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.queue ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.queue li{display:flex;align-items:center;gap:4px;padding:2px 10px 2px 2px;border-radius:99px;background:var(--paper);font-size:13px;color:var(--muted)}
.queue svg{width:26px;height:26px}
.more{display:block;width:100%;margin-top:6px;padding:9px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.more:hover{background:var(--panel);color:var(--ink)}
.feed li.minor span{color:var(--muted)}
@media (max-width:480px){.checks li{grid-template-columns:20px 1fr}.checks .tm{grid-column:2}
  .hero{grid-template-columns:48px 1fr;gap:4px 12px;padding:14px}
  .hero svg{width:48px;height:48px}
  .hero h1{font-size:18px}
  .tile{padding:16px 12px 8px;grid-template-columns:50px 1fr}
  .tile svg{width:48px;height:48px}
  .feed li{grid-template-columns:56px 1fr;gap:8px}
  .agents li{display:block}                          /* two lines, never a sideways scroll */
  .agents .a2{margin:2px 0 0 32px;justify-content:flex-start}
  .agents .arun{flex:1 1 auto}
  .agents .a1 .rnd{flex-basis:100%;padding-left:32px}   /* a loop's round: its own line */
}
.tile{background:var(--panel);border-radius:var(--r-sm);padding:22px 12px 8px;display:grid;
  grid-template-columns:62px 1fr;gap:0 12px;align-items:center;align-content:start;min-width:0}
.tile svg{width:60px;height:60px;grid-row:span 2;margin-top:4px}
.tile b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .role{font-size:12px;color:var(--muted)}
.tile .bar,.tile .meta{grid-column:1/-1}
.tile .bar{margin:8px 0 4px;height:4px}
.tile .why{grid-column:1/-1;font-size:12px;color:var(--bad-ink);margin-top:2px}
/* a running unit that has passed its own timeout: the number in the warn ink */
.tile .meta .over{color:var(--warn-ink);font-weight:600}

.feed{list-style:none;margin:0;padding:0;background:var(--panel);border-radius:var(--r-sm)}
.feed li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);font-size:13px}
.feed li.attn{background:var(--warn-bg);box-shadow:inset 3px 0 var(--warn)}
.feed .x{color:var(--muted)}

.wave{margin-bottom:8px;background:var(--panel);border-radius:var(--r-sm)}
.ph-head{width:100%;border:0;background:transparent;text-align:left;cursor:pointer;padding:11px 14px;
  display:grid;grid-template-columns:18px 1fr 14px;gap:1px 10px;align-items:center;border-radius:var(--r-sm)}
.ph-head:focus-visible{outline:2px solid var(--run);outline-offset:-2px}
.wave .wl{font-weight:600;font-size:14px}
.ph-head small{grid-column:2;color:var(--muted);font-size:13px}
.ph-head .chev{grid-column:3;grid-row:1/span 2;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.ph-head[aria-expanded="false"] .chev{transform:rotate(-45deg)}
.ph-head[aria-expanded="true"]{border-bottom:1px solid var(--line);border-radius:var(--r-sm) var(--r-sm) 0 0}
.wave.planned{background:transparent;border:1px dashed var(--line)}
.wave.planned .ph-head{cursor:default}
.wave.planned .mark{background:transparent;border:2px dashed var(--muted)}
.wave.planned .wl{font-weight:500;color:var(--muted)}
.wbody{padding:10px}
.wbody .tiles .tile{background:var(--paper)}
.frows{list-style:none;margin:8px 0 0;padding:0}
.frows:first-child{margin-top:0}
.frows li{display:grid;grid-template-columns:20px 1fr auto;gap:2px 10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);font-size:14px}
.frows li:first-child{border-top:0}
.frows small{color:var(--muted)} .frows .tm{color:var(--muted);font-size:13px;white-space:nowrap}
.frows .why{grid-column:2/-1;color:var(--bad-ink);font-size:12px}
.tail{margin:8px 4px 0;font-size:13px;color:var(--muted)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--sunk);border-top-color:var(--run);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
svg.robot{overflow:visible}
.robot .think{transform-box:fill-box;transform-origin:20% 100%;animation:pop 2.4s ease-in-out infinite}
.robot .think .d1,.robot .think .d2,.robot .think .d3{animation:dots 1.1s ease-in-out infinite}
.robot .think .d2{animation-delay:.18s}.robot .think .d3{animation-delay:.36s}
@keyframes dots{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@keyframes pop{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
svg.robot.thinking .body{animation:bob 2.6s ease-in-out infinite}
svg.robot.thinking .ant{animation:glow .9s ease-in-out infinite}
/* asleep on a slow program: slumped, breathing, big floating Zs */
svg.robot.waiting .body{animation:breathe 3s ease-in-out infinite}
svg.robot.waiting .prop{opacity:.55}
@keyframes breathe{0%,100%{transform:rotate(-6deg) translateY(2px) scaleY(.97)}50%{transform:rotate(-6deg) translateY(1px) scaleY(1)}}
.robot .zzz text{transform-box:fill-box;transform-origin:center;animation:zz 2.7s ease-in-out infinite;opacity:0}
.robot .zzz .z2{animation-delay:.9s}.robot .zzz .z3{animation-delay:1.8s}
@keyframes zz{0%{opacity:0;transform:translate(-4px,8px) scale(.6)}20%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(6px,-8px) scale(1.15)}}
.act{grid-column:1/-1;font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:center;min-width:0}
.act .k{flex:0 0 auto;font-size:11px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.act .k.think{color:var(--run-ink)} .act .k.wait{color:var(--warn-ink)} .act .k.tool{color:var(--ok-ink)}
/* the harness's own work (checks, the deviation audit): the tester family's colour,
   darkened for text -- the plain #D65A9A on --sunk is 2.94:1 in light, under AA */
.act .k.test{color:var(--test-ink)}
.act{align-items:flex-start}
.act .k{margin-top:1px}
/* what a working agent is on right now: up to two lines, so the end of the command or
   path -- the part that tells two calls apart -- stays readable on a phone */
.act .v{min-width:0;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.act code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.calls{grid-column:1/-1;margin-top:6px;font-size:12px}
.calls summary{cursor:pointer;color:var(--muted);list-style:none;display:flex;align-items:center;min-height:36px}
.calls summary::-webkit-details-marker{display:none}
.calls summary::before{content:"▸ ";} .calls[open] summary::before{content:"▾ ";}
.calls ol{margin:6px 0 0;padding:0;list-style:none}
.calls summary small{font-size:12px}
.calls li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)}
.calls .ct{font-weight:600}
/* a call's target wraps (two lines at most) instead of losing its tail to an ellipsis:
   the end of a path or a command is usually the part that says what it is */
.calls code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.calls li.bad .ct{color:var(--bad-ink)}
.calls .tm{color:var(--muted);white-space:nowrap}
.ctx{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.cbar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.cbar i{display:block;height:100%;background:#8b7fd6}
.ctx.hot .cbar i{background:var(--warn)} .ctx.hot span:last-child{color:var(--warn-ink);font-weight:600}
.tile.solo{margin-bottom:4px}
.checks{list-style:none;margin:0;padding:0;background:var(--panel);border-radius:var(--r-sm)}
.checks li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.checks li:first-child{border-top:0} .checks .tm{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:14px;background:var(--panel);border-radius:var(--r-sm);padding:14px}

/* robots */
svg.robot .body{transform-box:fill-box;transform-origin:50% 100%}
svg.robot .prop,svg.robot .eyes,svg.robot .ant{transform-box:fill-box}
svg.robot.running .body{animation:bob 1.6s ease-in-out infinite}
/* every worker: visor scans and blinks, antenna light pulses */
svg.robot.running .eyes{transform-origin:50% 50%;animation:scan 3.2s ease-in-out infinite}
svg.robot.running .ant{animation:glow 1.4s ease-in-out infinite}
/* each family does its own job */
svg.robot.running.p-clip .prop{transform-origin:50% 100%;animation:jot 1.1s ease-in-out infinite}
svg.robot.running.p-glass .prop{transform-origin:30% 30%;animation:search 2.4s ease-in-out infinite}
svg.robot.running.p-bulb .prop{transform-origin:50% 80%;animation:idea 2.2s ease-in-out infinite}
svg.robot.running.p-wrench .prop{transform-origin:10% 95%;animation:turn .55s ease-in-out infinite alternate}
svg.robot.running.p-brush .prop{transform-origin:5% 95%;animation:stroke 1.2s ease-in-out infinite}
svg.robot.running.p-brush .dab{animation:dab 1.2s ease-in-out infinite}
svg.robot.running.p-check .prop{transform-origin:50% 50%;animation:stamp 1.6s ease-in-out infinite}
svg.robot.running.p-net .prop{transform-origin:5% 95%;animation:swoop 1.4s cubic-bezier(.5,0,.3,1) infinite}
svg.robot.running.p-merge .prop path{stroke-dasharray:4 4;animation:flow .8s linear infinite}
@keyframes scan{0%,100%{transform:translateX(-2.5px)}45%{transform:translateX(2.5px)}48%{transform:translateX(2.5px) scaleY(.15)}51%{transform:translateX(2.5px)}}
@keyframes glow{50%{opacity:.35}}
@keyframes jot{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg) translateY(-1px)}}
@keyframes search{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,-3px)}50%{transform:translate(1px,-5px)}75%{transform:translate(3px,1px)}}
@keyframes idea{0%,60%,100%{opacity:1;transform:scale(1)}65%{opacity:.3}70%{opacity:1;transform:scale(1.18)}80%{transform:scale(1)}}
@keyframes turn{from{transform:rotate(-22deg)}to{transform:rotate(12deg)}}
@keyframes stroke{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(10deg) translate(2px,1px)}}
@keyframes dab{0%,40%{opacity:0;transform:scale(.4)}60%,100%{opacity:1;transform:scale(1)}}
@keyframes stamp{0%,70%,100%{transform:scale(1)}78%{transform:scale(.82) translateY(2px)}86%{transform:scale(1.12)}}
@keyframes swoop{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(14deg)}}
@keyframes flow{to{stroke-dashoffset:-8}}
svg.robot.queued{opacity:.5}
svg.robot.dropped,svg.robot.killed,svg.robot.notrun{filter:grayscale(1);opacity:.55}
@keyframes bob{50%{transform:translateY(-3px)}}
/* the in-page motion pause (WCAG 2.2.2: endless motion needs a control, not only the
   OS setting): Pause motion in the top bar puts `still` on <html> and every loop stops
 -- the robots stay, frozen; the Zzz marks show, since their loop is what drew them */
.still *,.still *::before,.still *::after{animation-play-state:paused!important}
.still .robot .zzz text{opacity:1}
.still-btn{border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;
  padding:6px 8px;border-radius:6px}
.still-btn:hover{background:var(--sunk);color:var(--ink)}
/* a viewer that stopped answering: freeze what the page last showed and say so --
   the running pill goes quiet and the loops stop, so nothing pretends the run is live */
.pulse.warn{color:var(--warn-ink)}
.dot.warn{background:var(--warn)}
p.offline{background:var(--warn-bg);color:var(--ink);box-shadow:inset 3px 0 var(--warn);
  padding:10px 12px;margin:0 0 12px;border-radius:var(--r-sm)}
.offline svg.robot *,.offline .spin,.offline .dot{animation-play-state:paused!important}
.offline .pill.running{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dot.live{box-shadow:none}.spin{border-top-color:var(--run);border-right-color:var(--run)}.robot .zzz text{opacity:1}svg.robot.waiting .body{transform:rotate(-6deg) translateY(2px)}}
/* Claude usage */
/* The panel that counts the real claude -p calls (advisor and claude-checks). One
   card, its role sections under a hairline; the summary line and the call breakdown
   sit in the muted tone, the "without a cost" note in the warn ink (it says a number
   is incomplete), and the collapse control is text in the run ink -- every status
   colour on this panel is an --*-ink token, so it holds 4.5:1 in both themes like the
   rest of the page. */
.claude{background:var(--panel);border-radius:var(--r-lg);padding:10px 14px 14px;margin:14px 0 22px}
.claude h2{margin:4px 0 0}
.claude .csum{margin:2px 0 0;color:var(--muted);font-size:14px}
.claude-t{background:transparent;border:0;color:var(--run-ink);font-size:13px;cursor:pointer;
  padding:6px 8px;border-radius:6px}
.claude-t:hover{background:var(--sunk);color:var(--ink)}
.croles{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.crole{font-size:14px;margin:3px 0}
.crole b{font-weight:650}
.crole .brk{color:var(--muted);font-size:13px}
.crole .noprice,.claude .csum .noprice{color:var(--warn-ink);font-size:13px}

<script>
"use strict";
var PAGE_VERSION="__PAGE_VERSION__";  /* lib/watch.py replaces this placeholder at serve

                                         the file's bytes); the tab compares it against
                                         the `page` every API answer carries below */
var FAM={
  planner:{c:"#E9A23B",roles:["planner","scoper","triager"],prop:"clip"},
  searcher:{c:"#3FA7D6",roles:["searcher","reader"],prop:"glass"},
  thinker:{c:"#A26BD8",roles:["hypothesizer","prober","profiler"],prop:"bulb"},
  builder:{c:"#E0663F",roles:["implementer","coder","mechanic"],prop:"wrench"},
  painter:{c:"#F2C14E",roles:["writer"],prop:"brush"},
  checker:{c:"#4CAE6E",roles:["reviewer","verifier","checker","confirmer","auditor"],prop:"check"},
  tester:{c:"#D65A9A",roles:["tester"],prop:"net"},
  weaver:{c:"#2BB3A3",roles:["synthesizer"],prop:"merge"},
  plain:{c:"#9A9A9A",roles:[],prop:""}
};
var KIND_FAM={swarm:"planner",research:"searcher","until-done":"builder",agent:"checker"};
var KIND_NAME={swarm:"Swarm",research:"Deep research","until-done":"Coder loop",agent:"Single agent"};
var P={
 clip:'<rect x="62" y="44" width="18" height="24" rx="2" fill="#fff" stroke="#333" stroke-width="2"/><rect x="66" y="41" width="10" height="5" rx="1" fill="#555"/><path d="M65 52h12M65 57h12M65 62h8" stroke="#555" stroke-width="2"/>',
 glass:'<circle cx="70" cy="50" r="9" fill="#dff3ff" stroke="#333" stroke-width="3"/><path d="M76 57l8 9" stroke="#333" stroke-width="4" stroke-linecap="round"/>',
 bulb:'<circle cx="72" cy="30" r="9" fill="#ffe66b" stroke="#333" stroke-width="2"/><rect x="68" y="38" width="8" height="6" fill="#888"/><path d="M72 18v-5M60 24l-4-3M84 24l4-3" stroke="#e8b400" stroke-width="2"/>',
 wrench:'<path d="M64 66l14-18" stroke="#666" stroke-width="5" stroke-linecap="round"/><circle cx="80" cy="45" r="7" fill="none" stroke="#666" stroke-width="5"/>',
 brush:'<path d="M63 70l15-22" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><path d="M76 50l6-9 5 3-5 9z" fill="#ccc" stroke="#333" stroke-width="1.5"/><path d="M82 41q5-6 9-3q-2 6-7 6z" fill="#e0663f" stroke="#333" stroke-width="1.5"/><circle class="dab" cx="88" cy="58" r="3" fill="#3fa7d6"/>',
 check:'<circle cx="72" cy="52" r="11" fill="#fff" stroke="#333" stroke-width="2"/><path d="M66 52l4 4 8-9" stroke="#2e9a54" stroke-width="3.5" fill="none" stroke-linecap="round"/>',
 net:'<path d="M62 70l14-22" stroke="#7a5230" stroke-width="3"/><ellipse cx="80" cy="42" rx="9" ry="7" fill="none" stroke="#333" stroke-width="2"/><path d="M73 40l14 4M75 46l10-8" stroke="#333" stroke-width="1"/>',
 merge:'<path d="M62 40c8 0 8 10 14 10M62 60c8 0 8-10 14-10M76 50h10" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>'
};
function famOf(role){for(var k in FAM){if(FAM[k].roles.indexOf(role)>=0)return FAM[k];}return FAM.plain;}
function robot(f,state){
  var eye=state==="dropped"||state==="killed"||state==="notrun"?"#666":state==="queued"?"#3a4150":"#7ff";
  if(state==="waiting")eye="#3a4150";
  var badge=state==="thinking"?'<g class="think"><ellipse cx="82" cy="8" rx="20" ry="14" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><circle cx="66" cy="26" r="4" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/><circle cx="60" cy="33" r="2.4" fill="#fff" stroke="#2b2b2b" stroke-width="1.5"/><circle class="d1" cx="73" cy="8" r="3.4" fill="#2F6FED"/><circle class="d2" cx="82" cy="8" r="3.4" fill="#2F6FED"/><circle class="d3" cx="91" cy="8" r="3.4" fill="#2F6FED"/></g>':
    state==="waiting"?'<g class="zzz" font-family="system-ui,sans-serif" font-weight="800" fill="#2F6FED" stroke="#fff" stroke-width="1.2" paint-order="stroke"><text class="z1" x="66" y="22" font-size="16">z</text><text class="z2" x="78" y="8" font-size="22">z</text><text class="z3" x="92" y="-10" font-size="30">Z</text></g>':
    state==="done"||state==="cached"?'<circle cx="78" cy="20" r="9" fill="#17905F"/><path d="M73.5 20l3 3 5.5-6.5" stroke="#fff" stroke-width="2.5" fill="none"/>':
    state==="queued"?'<text x="66" y="18" font-size="12" font-family="system-ui" fill="#8894a5">z z</text>':"";
  return '<svg class="robot '+state+' p-'+(f.prop||'none')+'" viewBox="0 0 96 96" aria-hidden="true"><g class="body">'+
   '<ellipse cx="48" cy="90" rx="22" ry="4" fill="#0002"/><path d="M48 14v8" stroke="#2b2b2b" stroke-width="2.5"/>'+
   '<circle class="ant" cx="48" cy="12" r="4" fill="'+f.c+'" stroke="#2b2b2b" stroke-width="2"/>'+
   '<rect x="24" y="22" width="48" height="34" rx="8" fill="#d9dde3" stroke="#2b2b2b" stroke-width="2.5"/>'+
   '<rect x="31" y="31" width="34" height="14" rx="5" fill="#223"/>'+
   (state==="waiting"?'<g class="eyes"><path d="M36 38h8M52 38h8" stroke="#7ff" stroke-width="2.5" stroke-linecap="round" opacity=".6"/></g>':'<g class="eyes"><circle cx="40" cy="38" r="3.5" fill="'+eye+'"/><circle cx="56" cy="38" r="3.5" fill="'+eye+'"/></g>')+
   '<rect x="28" y="58" width="40" height="26" rx="5" fill="'+f.c+'" stroke="#2b2b2b" stroke-width="2.5"/>'+
   '<rect x="38" y="64" width="20" height="6" rx="2" fill="#fff8"/></g>'+
   '<g class="prop">'+(P[f.prop]||"")+'</g>'+badge+'</svg>';
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function dur(s){if(s==null||!isFinite(s))return "";s=Math.max(0,Math.round(s));
  if(s<60)return s+"s";var m=Math.floor(s/60);if(m<60)return (m+"m "+(s%60?(s%60)+"s":"")).trim();var h=Math.floor(m/60);return h+"h "+(m%60)+"m";}
function ago(t){return dur(Date.now()/1000-t)+" ago";}
function clock(t){if(typeof t!=="number"||!isFinite(t)||Math.abs(t)>8.64e12)return "";
  var d=new Date(t*1000);return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});}
function pct(p){return Math.round(Math.max(0,Math.min(1,p||0))*100);}
function cnt(n,w){return esc(n)+" "+(n===1?w:w+"s");}  /* "1 agent", "2 agents" */
function outcome(r){ if(r.state==="killed")return "killed"; if(r.state!=="ended")return "running";
  return (r.exit===0||r.exit==null)?"ended":"failed";}
/* A bar is a progressbar a screen reader lands on, so it needs a name and its fill a
   reading: label what the bar is, text what the fill MEANS ("probe: 2 of 40 agents
   done") -- an unnamed 6-pixel strip tells a blind user nothing. */
function bar(p,cls,label,text){
  return '<div class="bar '+(cls||"")+'" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct(p)+
    '" aria-label="'+esc(label||"Progress")+'"'+(text?' aria-valuetext="'+esc(text)+'"':"")+'><i style="width:'+pct(p)+'%"></i></div>';}

function cardMeter(r){
  var o=outcome(r);
  // a failed or killed run shows how far it got, not a full bar: its real progress
  if(o!=="running") return bar(r.progress!=null?r.progress:1,o==="ended"?"ok":"bad","Run progress",progA11y(r));
  return bar(r.progress, r.kind==="agent"&&r.progress>0.85?"hot":"","Run progress",progA11y(r));
}
function progressText(r){
  if(r.kind==="until-done"){var rn=r.round&&r.round.n!=null?r.round.n:r.rounds;
    var t=rn!=null&&r.max_rounds?("Round "+rn+" of "+r.max_rounds):(r.max_rounds?("Up to "+r.max_rounds+" rounds"):"");
    var c=r.checks;if(c&&c.total)t+=", "+c.passed+" of "+cnt(c.total,"check")+" pass";return t;}
  if(r.kind==="agent") return r.timeout?(dur(r.elapsed)+" of a "+dur(r.timeout)+" limit"):dur(r.elapsed);
  var ph=r.phase; if(!ph) return "Starting";
  var done=0,us=r.units||{}; (ph.units||[]).forEach(function(n){var u=us[n];if(u&&["done","cached","dropped"].indexOf(u.state)>=0)done++;});
  return (ph.label||"Phase")+": "+done+" of "+cnt(ph.n||0,"agent")+" done";
}
function etaText(r){return r.eta!=null&&outcome(r)==="running"?("About "+dur(r.eta)+" left"):"";}
/* A live duration is NEVER baked into the page's HTML: it is a tick span, filled by the
   1 s ticker from its own data-since. A run that said nothing in the last 2.5 s then
   produces a byte-identical page, and render() can skip the rebuild (or rebuild only
   the sections whose HTML changed) instead of tearing down the robots, the selection
   and the crew strip every poll. */
function tickSpan(since,fmt){return typeof since==="number"&&isFinite(since)
  ?'<span class="tick" data-since="'+since+'" data-fmt="'+fmt+'"></span>':"";}
function elapsedHtml(r){return outcome(r)==="running"&&typeof r.start==="number"&&isFinite(r.start)
  ?tickSpan(r.start,"dur"):dur(r.elapsed);}
function agoHtml(t){return tickSpan(t,"ago");}
/* the progress line and the bar's valuetext, tick-safe: the agent's live elapsed is a
   tick span in the visible line and stays out of the bar's text entirely (a number
   baked there changes the HTML every poll and re-announces itself to no one) */
function progHtml(r){
  if(outcome(r)==="running"&&r.kind==="agent"&&typeof r.start==="number"&&isFinite(r.start))
    return tickSpan(r.start,"dur")+(r.timeout?" of a "+dur(r.timeout)+" limit":"");
  return esc(progressText(r));}
function progA11y(r){
  if(outcome(r)==="running"&&r.kind==="agent")
    return r.timeout?"Running against a "+dur(r.timeout)+" limit":"Running";
  return progressText(r);}
/* The overview reads the same moods the run page's tiles pose with: actPose stays the
   ONE pose mapping (the crew robots and the Active agents rows pass their mood entry
   to it exactly as a unit does), moodWords gives that same state its WORDS ("thinking",
   "waiting on a tool", "Read src/x.py") and loopMood the coder loop's step its robot,
   pose and words -- the tester while testing, the checker while reviewing, the builder
   asleep between rounds. Nobody draws a second copy of any of it. */
function moodWords(a){
  if(!a||a.state==="done")return "working";              // no line yet: plainly running
  if(a.state==="thinking")return "thinking";
  if(a.state==="waiting")return "waiting on a tool";
  var t=a.target||"";
  if(a.cls==="python")return /pytest/.test(t)?"running tests":"running Python";
  if(a.cls==="read"||a.cls==="edit")return (a.tool||"Working on")+(t?" "+t:"");
  if(a.cls==="shell")return "running a command"+(t?": "+t:"");
  if(a.cls==="web")return "on the web";
  if(a.cls==="delegate")return "delegating";
  return "using "+(a.tool||"a tool");
}
function moodTimed(a){return !!a&&(a.state==="thinking"||a.state==="waiting"||
  (a.state==="tool"&&a.cls==="python"));}  // these moods carry "for 1m 51s"; a tool
                                           // state words itself through its target
function loopMood(r){var st=r.step,a=r.activity;
  if(st&&st.name==="testing")return {f:FAM.tester,pose:"running",word:"running tests",
    timed:true,since:typeof st.since==="number"?st.since:null};
  if(st&&st.name==="reviewing")return {f:FAM.checker,pose:"running",word:"reviewing the diff",
    timed:true,since:typeof st.since==="number"?st.since:null};
  if(st&&st.name==="between")return {f:FAM.builder,pose:"waiting",word:"waiting between rounds",
    timed:true,since:typeof st.since==="number"?st.since:null};
  return {f:FAM.builder,pose:actPose({state:"running",activity:a}),word:moodWords(a),
    timed:moodTimed(a),since:a&&typeof a.since==="number"?a.since:null};
}
function shortTitle(t){t=String(t==null?"":t);return t.length>40?t.slice(0,39)+"…":t;}
/* One row per running agent across all live runs, ready to render: needs-you first,
   then the longest in its current state. A run past the "No update for" threshold
   shows its robots in the waiting pose -- a live pid that stopped speaking is not a
   working robot, whatever its last activity line said. */
function agentRows(live){var rows=[];
  live.forEach(function(r){
    var quiet=quietFor(r)>900;
    if(r.kind==="swarm"||r.kind==="research"){
      var us=r.units||{},moods=r.moods||{};
      Object.keys(us).forEach(function(n){var u=us[n];if(u.state!=="running")return;
        var e=moods[n]||null;
        rows.push({r:r,unit:n,name:n,role:u.role||"",f:famOf(u.role),
          pose:quiet?"waiting":actPose({state:"running",activity:e}),
          word:moodWords(e),timed:moodTimed(e),
          since:e&&typeof e.since==="number"?e.since:null,
          started:e&&e.started!=null?e.started:u.started,
          timeout:e&&e.timeout!=null?e.timeout:u.timeout,
          ctx:e&&e.ctx,win:e&&e.win,needs:!!(e&&e.needs_you)});});
    }else if(r.kind==="until-done"){var lm=loopMood(r),a=r.activity||null;
      rows.push({r:r,unit:"coder",name:"coder",role:"coder loop",f:lm.f,
        pose:quiet?"waiting":lm.pose,word:lm.word,timed:lm.timed,since:lm.since,
        started:r.round&&r.round.started!=null?r.round.started:r.start,
        timeout:r.round&&r.round.timeout!=null?r.round.timeout:r.timeout,
        ctx:a&&a.ctx,win:a&&a.win,needs:(r.attention_count||0)>0,
        loop:true,round:r.round,checks:r.checks});
    }else{var a2=r.activity||null;
      rows.push({r:r,unit:"agent",name:"agent",role:"single agent",f:FAM.checker,
        pose:quiet?"waiting":actPose({state:"running",activity:a2}),
        word:moodWords(a2),timed:moodTimed(a2),
        since:a2&&typeof a2.since==="number"?a2.since:null,
        started:r.start,timeout:r.timeout,ctx:a2&&a2.ctx,win:a2&&a2.win,
        needs:(r.attention_count||0)>0});}
  });
  rows.sort(function(x,y){var d=(y.needs?1:0)-(x.needs?1:0);if(d)return d;
    var xs=x.since==null?Infinity:x.since,ys=y.since==null?Infinity:y.since;
    return xs<ys?-1:xs>ys?1:0;});   // needs-you first, then longest in its state --
  return rows;}                     // a row with no stamp joins last, never a NaN sort
function agentsHtml(live){var rows=agentRows(live);if(!rows.length)return "";
  var best=null,bestN=0;  // the overflow link goes to the run with the most working agents
  live.forEach(function(r){var us=r.units||{},
    n=Object.keys(us).filter(function(k){return us[k].state==="running";}).length||1;
    if(n>bestN){bestN=n;best=r;}});
  var shown=rows.slice(0,AGENTS_SHOW),now=Date.now()/1000;
  var h='<div data-sec="agents"><h2>Active agents <small>'+rows.length+'</small></h2><ul class="agents">';
  h+=shown.map(function(x){
    var mood=esc(x.word)+(x.timed&&x.since!=null?' '+tickSpan(x.since,"dur"):"");
    var rnd="";
    if(x.loop){
      if(x.round&&x.round.n!=null)rnd="round "+x.round.n;
      if(x.checks&&x.checks.total!=null)rnd+=(rnd?", ":"")+
        (x.checks.passed!=null?x.checks.passed:"?")+" of "+x.checks.total+" checks passing";}
    var tt="";
    if(typeof x.started==="number"&&isFinite(x.started)){
      var over=x.timeout!=null&&now-x.started>x.timeout;
      tt='<span class="atime'+(over?" over":"")+'">'+tickSpan(x.started,"dur")+
        (x.timeout!=null?' / '+esc(dur(x.timeout)):"")+'</span>';}
    var cc=x.ctx&&x.win?'<span class="actx'+(x.ctx/x.win>0.85?" hot":"")+'">'+
      kTok(x.ctx)+' / '+kTok(x.win)+'</span>':"";
    return '<li'+(x.needs?' class="attn"':"")+'><span class="a1">'+robot(x.f,x.pose)+
      '<b>'+esc(x.name)+'</b>'+(x.role?'<small class="role">'+esc(x.role)+'</small>':"")+
      '<span class="mood">'+mood+'</span>'+
      (rnd?'<small class="rnd">'+esc(rnd)+'</small>':"")+'</span>'+
      '<span class="a2"><a class="arun" href="#'+esc(x.r.id)+'" data-fk="agent:'+
        esc(x.r.id)+':'+esc(x.unit)+'" title="'+esc(x.r.title||"")+'">'+
        esc(shortTitle(x.r.title))+'</a>'+tt+cc+'</span></li>';}).join("");
  if(rows.length>shown.length&&best)
    h+='<li class="am"><a href="#'+esc(best.id)+'" data-fk="agent:'+esc(best.id)+
      ':more">and '+(rows.length-shown.length)+' more</a></li>';
  return h+'</ul></div>';}

function overview(runs){
  var live=runs.filter(function(r){return outcome(r)==="running";});
  var hid=hidden();var fin=runs.filter(function(r){return outcome(r)!=="running"&&!hid[r.id];});
  var mates=[];
  live.forEach(function(r){
    var us=r.units||{},names=Object.keys(us).filter(function(n){return us[n].state==="running";});
    // past the "No update for" threshold a live pid has stopped speaking: the whole
    // crew of that run shows the waiting pose, whatever its last activity line said
    var quiet=quietFor(r)>900;
    if(names.length){var moods=r.moods||{};
      names.forEach(function(n){var e=moods[n]||null;
        mates.push({f:famOf(us[n].role),label:n,id:r.id,
          pose:quiet?"waiting":actPose({state:"running",activity:e}),
          word:moodWords(e),since:e&&typeof e.since==="number"?e.since:null});});}
    else if(r.kind==="until-done"){var lm=loopMood(r);   // the loop's robot follows its
      mates.push({f:lm.f,label:"coder",id:r.id,          // step, as the run page reads it
        pose:quiet?"waiting":lm.pose,word:lm.word,since:lm.since});}
    else mates.push({f:FAM[KIND_FAM[r.kind]]||FAM.plain,label:{agent:"agent","until-done":"coder",swarm:"swarm",research:"research"}[r.kind]||r.kind,id:r.id,
      pose:quiet?"waiting":actPose({state:"running",activity:r.activity}),
      word:moodWords(r.activity),
      since:r.activity&&typeof r.activity.since==="number"?r.activity.since:null});
  });
  var head=live.length?(mates.length+(mates.length===1?" agent":" agents")+" at work"):"All quiet";
  var sub=live.length?(live.length===1?"One run in progress":live.length+" runs in progress"):"Start a local agent and it appears here.";
  var h='<div data-sec="floor"><section class="floor"><h1>'+head+'</h1><p>'+sub+'</p><div class="crew">';
  h=claudePanel(claudeData)+h;   // the Claude usage panel rides at the page's top
  // sixteen robots at most: a two-hundred-agent run is a wall of identical loops, and
  // every one of them is a tab stop and an animation for nothing -- the rest count in
  // the chip. They are decoration beside the cards below, so they leave the tab order.
  // Each poses in its mood (actPose, the very mapping the run page's tiles use) and
  // says it in words, in its title and its label: "check-06, waiting on a tool, 1m 51s".
  // The duration is a ticking span, never a baked number: a baked one would change the
  // section's HTML every poll, swap it, and restart every robot's animation.
  h+=mates.length?mates.slice(0,CREW_SHOW).map(function(m){var t=m.label+", "+m.word;
    var tk=m.since==null?"":tickSpan(m.since,"dur");
    return '<a class="mate" href="#'+esc(m.id)+'" data-fk="mate:'+esc(m.id)+':'+esc(m.label)+'" title="'+esc(t)+'" tabindex="-1" aria-hidden="true">'+robot(m.f,m.pose)+'<span>'+esc(t)+(tk?", "+tk:"")+'</span></a>';}).join("")+(mates.length>CREW_SHOW?'<span class="mate chip" aria-hidden="true">+'+(mates.length-CREW_SHOW)+'</span>':""):['planner','builder','checker'].map(function(k){return '<span class="mate" aria-hidden="true">'+robot(FAM[k],'queued')+'</span>';}).join('');
  h+='</div></section></div>';
  h+=agentsHtml(live);   // who is doing what, right now, under the crew strip
  if(live.length){
    h+='<div data-sec="runs"><h2>Running <small>'+live.length+'</small></h2>';
    h+=live.map(function(r){
      var f=FAM[KIND_FAM[r.kind]]||FAM.plain,att=r.attention_count||0;
      // A single-shot session or a coder loop has no tiles of its own, so the card itself
      // carries what that one agent is doing: the same status line the run view shows,
      // read off the run's own activity (the fold's, not a second source).
      var a=(r.kind==="agent"||r.kind==="until-done")&&r.activity?r.activity:null;
      var pose=a?actPose({state:"running",activity:a}):"running";
      var extra=a?actLine({state:"running",activity:a})+ctxHtml(a):"";
      // a coder loop's own step outranks its activity between the rounds: while the
      // harness runs the checks it is the tester at work, while the deviation audit
      // reads the diff the checker, and in between the builder thinks.
      var st=r.kind==="until-done"?r.step:null;
      var quiet=quietFor(r);  // a live pid saying nothing for 15 minutes is not live
      if(st&&st.name!=="coding"){
        f=st.name==="testing"?FAM.tester:st.name==="reviewing"?FAM.checker:FAM.builder;
        pose=st.name==="between"?"thinking":"running";
        extra='<div class="act"><span class="k test">'+
          (st.name==="testing"?"Testing":st.name==="reviewing"?"Reviewing":"Between rounds")+
          '</span></div>'+(a?ctxHtml(a):"");
      }
      return '<a class="run" href="#'+esc(r.id)+'" data-fk="run:'+esc(r.id)+'">'+robot(f,pose)+
        '<div><div class="kind">'+esc(KIND_NAME[r.kind]||r.kind)+'</div><div class="title">'+esc(r.title)+'</div></div>'+
        '<div class="sub"><span>'+progHtml(r)+'</span>'+(att?'<span class="flag">'+att+(att===1?" item needs":" items need")+' you</span>':"")+
          (quiet>900?'<span class="flag">No update for '+dur(quiet)+'</span>':"")+'</div>'+
        '<div class="meter">'+cardMeter(r)+'<div class="meta"><span>'+elapsedHtml(r)+' elapsed</span><span>'+esc(etaText(r))+'</span></div></div>'+
        extra+'</a>';
    }).join("");
    h+='</div>';
  }
  if(fin.length){
    h+='<div data-sec="done"><div class="sec-head"><h2>Finished <small>'+fin.length+'</small></h2><button type="button" class="clear" data-fk="clear" data-hide="'+esc(fin.map(function(r){return r.id;}).join(','))+'">Clear finished</button></div><ul class="done-list">';
    h+=fin.map(function(r){var o=outcome(r);
      var m=o==="ended"?'<span class="mark ok" role="img" aria-label="finished">✓</span>':o==="failed"?'<span class="mark bad" role="img" aria-label="failed">!</span>':'<span class="mark gone" role="img" aria-label="Stopped">×</span>';
      var right=(o==="failed"?"exit "+esc(String(r.exit))+", ":o==="killed"?"stopped, ":"")+"took "+dur(r.elapsed);
      // the "when" only joins the line when the end is a real stamp (a hand-built
      // pointer can put anything in end; a comma for a clock that will never fill is not a reading)
      var when=typeof r.end==="number"&&isFinite(r.end)?", "+agoHtml(r.end):"";
      return '<li class="row"><a class="row-link" href="#'+esc(r.id)+'" data-fk="row:'+esc(r.id)+'">'+m+'<span class="t">'+esc(r.title)+'</span><span class="r">'+esc(right)+when+'</span></a>'+
        '<button type="button" class="x-btn" data-fk="hide:'+esc(r.id)+'" data-hide="'+esc(r.id)+'" aria-label="Hide this run" title="Hide">×</button></li>';}).join("");
    h+='</ul></div>';
  }
  return h;
}

/* The hero's "now" line for a run made of phases: which phase is running, where it
   sits among all of them (the outline's placeholders count), and who is busy in it. */
function nowHtml(r,o){
  if(o!=="running"||(r.kind!=="swarm"&&r.kind!=="research")||!r.phase)return "";
  // the outline's whole shape: started, planned — and the phases the workflow jumped over
  var total=(r.phases||[]).length+(Array.isArray(r.planned)?r.planned.length:0)+(Array.isArray(r.skipped)?r.skipped.length:0);
  var us=r.units||{},run=0,wait=0;
  (r.phase.units||[]).forEach(function(n){var u=us[n];if(!u)return;if(u.state==="running")run++;else if(u.state==="queued")wait++;});
  var where=total>1?"Phase "+(r.phases||[]).length+" of "+total:"";
  var who=[run?run+" working":"",wait?wait+" waiting":""].filter(Boolean).join(", ");
  return '<div class="now"><span class="ph">'+esc(r.phase.label||"Phase")+'</span>'+
    (where?'<small>'+esc(where)+'</small>':"")+(who?'<small>'+esc(who)+'</small>':"")+'</div>';
}
var STATE_WORD={running:"working",queued:"waiting",done:"done",cached:"reused",dropped:"dropped","not run":"did not run"};
function detail(r){
  var o=outcome(r),f=FAM[KIND_FAM[r.kind]]||FAM.plain;
  var pillWord={running:"Running",ended:"Finished",failed:"Failed (exit "+esc(String(r.exit))+")",killed:"Stopped"}[o];
  var quiet=quietFor(r);
  var h='<div data-sec="back"><a class="back" href="#" data-fk="back">← All runs</a></div>';
  // the stat row sits ABOVE the goal: a long goal must not fill the first phone screen
  // before any status shows, so it clamps at three lines until the reader opens it.
  // The button appears from 80 characters: three phone lines hold ~96 at most, so any
  // goal the clamp can bite is past the threshold -- a clamped goal is never unopenable
  var goal=esc(r.goal||r.title),longGoal=(r.goal||r.title||"").length>80||!!goalFull[r.id];
  var gbtn=longGoal?'<button type="button" class="more" data-goal="'+esc(r.id)+'" data-fk="goal" aria-expanded="'+(goalFull[r.id]?"true":"false")+'">'+(goalFull[r.id]?"Show less":"Show full goal")+'</button>':"";
  h+='<section class="hero'+(goalFull[r.id]?" full":"")+'" data-sec="hero">'+robot(f,o==="running"?"running":o==="ended"?"done":"killed")+
     '<div class="stat"><span class="pill '+o+'">'+pillWord+'</span><span>'+esc(KIND_NAME[r.kind]||r.kind)+'</span><span><b>'+elapsedHtml(r)+'</b> elapsed</span>'+
       (etaText(r)?'<span>'+esc(etaText(r))+'</span>':"")+
       (o==="running"&&quiet>900?'<span class="flag">No update for '+dur(quiet)+'</span>':"")+'</div>'+
     '<div><h1>'+goal+'</h1>'+gbtn+nowHtml(r,o)+'</div>'+
     '<div class="meter">'+bar(o==="running"?r.progress:(r.progress!=null?r.progress:1),
       o==="running"?"":(o==="ended"?"ok":"bad"),"Run progress",progA11y(r))+
       '<div class="meta"><span>'+progHtml(r)+'</span>'+(r.report_stop?'<span>'+esc(r.report_stop)+'</span>':"")+'</div></div></section>';
  h+=claudeRunPanel(r.claude);   // this run's own real-Claude calls, when it made any
  // the attention items the overview counts with its flag, listed here in full: the run
  // page must say WHAT needs you, latest first, not just that something does
  var atts=Array.isArray(r.attention)?r.attention.slice().reverse():[];
  if(atts.length){
    h+='<div data-sec="att"><h2>Needs you <small>'+atts.length+'</small></h2><ul class="feed">'+
      atts.map(function(a){return '<li class="attn"><time>'+clock(a.t)+'</time><span><b>'+esc(a.reason)+
        '</b>'+(a.detail?' <span class="x">'+esc(a.detail)+'</span>':"")+'</span></li>';}).join("")+'</ul></div>';
  }

  if(r.kind==="until-done"||r.kind==="agent"){var sHtml=soloHtml(r,o);if(sHtml)h+='<div data-sec="solo">'+sHtml+'</div>';}
  var us=r.units||{},names=Object.keys(us),planned=Array.isArray(r.planned)?r.planned:[];
  // the outline entries a phase_start jumped over: they must not vanish from the shape
  // of the run -- each one shows, in outline order, as a placeholder saying Skipped
  var skips=Array.isArray(r.skipped)?r.skipped:[];
  if(names.length||planned.length||skips.length){
    var phases=(r.phases||[]).slice(),seen={},occ={};
    // a phase's key is its label plus which time that label came up: stable while
    // phases are added around it (an index is not), and two "check" phases stay apart
    function pkey(label){var l=String(label==null?"":label);occ[l]=(occ[l]||0)+1;return r.id+"|"+l+"|"+occ[l];}
    var waves=phases.map(function(p,i){var list=(p.units||[]).filter(function(n){return us[n];});
      list.forEach(function(n){seen[n]=1;});return {p:p,i:i,list:list,key:pkey(p.label||("Phase "+(i+1)))};});
    var loose=names.filter(function(n){return !seen[n];});
    if(loose.length) waves.push({p:{label:"Other agents",n:loose.length,end:null},i:waves.length,list:loose,loose:true,key:pkey("Other agents")});
    // the declared phases no phase_start has taken yet: quiet placeholders after the
    // started ones, so the whole run shows from its first second
    planned.forEach(function(p){waves.push({p:p,i:waves.length,list:[],planned:true,key:pkey(p.label)});});
    // a passed-over phase sits in OUTLINE order, not after every later placeholder: it
    // was there when the workflow jumped past it, so it renders among the started
    // phases -- before the phase the run jumped to, by the outline position the fold
    // carries (a phase that took nothing from the outline has no pos to compare)
    skips.forEach(function(p){var at=waves.length;
      if(typeof p.pos==="number")for(var wi=0;wi<waves.length;wi++){var wv=waves[wi],wp=wv.p&&wv.p.pos;
        if(!wv.planned&&!wv.loose&&typeof wp==="number"&&wp>p.pos){at=wi;break;}}
      waves.splice(at,0,{p:p,i:at,list:[],planned:true,skipped:true,key:pkey(p.label)});});
    var started=waves.filter(function(w){return !w.planned&&!w.loose;}).length;
    // the subtitle only says how far the run got into its outline: the hero's "now"
    // line already names who is working and who is waiting, in the live phase
    var sub=(planned.length||skips.length)?started+" of "+(started+planned.length+skips.length)+" started"
                                          :cnt(waves.length,"phase");
    h+='<div data-sec="ph-hd"><h2>Phases <small>'+esc(sub)+'</small></h2></div><div class="phases">';
    h+=waves.map(function(w){return wave(w,r,us,o);}).join("")+'</div>';
  }
  // latest first; same stamp keeps file order, so a phase_start never lands below the
  // units it started (or a checks_start below its round, or an audit_end below its audit)
  var ev=(r.recent||[]).map(function(e,i){return {e:e,i:i};})
    .sort(function(x,y){return y.e.t-x.e.t||x.i-y.i;});
  if(ev.length){
    // eight lines by default; the button says EARLIER (it lifts older lines into view)
    // and only when hiding would actually hide something worth a tap -- with two or
    // fewer left over, all of them show. When the server's window is full, say where
    // the rest went.
    var leftover=ev.length-FEED_SHOW,openAll=!!feedAll[r.id],all=openAll||leftover<=2;
    var shown=all?ev:ev.slice(0,FEED_SHOW);
    h+='<div data-sec="feed"><h2>Activity <small>latest first</small></h2><ul class="feed">';
    h+=shown.map(function(x){var e=x.e;var txt=evText(e);return '<li class="'+(e.kind==="attention"?"attn":e.kind==="unit_start"?"minor":"")+'"><time>'+clock(e.t)+'</time><span>'+txt+'</span></li>';}).join("");
    h+='</ul>';
    if((r.recent||[]).length>=RECENT_KEEP) h+='<p class="tail">Older events are not kept here.</p>';
    if(leftover>2) h+='<button type="button" class="more" data-more="'+esc(r.id)+'" data-fk="more:'+esc(r.id)+'" aria-expanded="'+openAll+'">'+(openAll?"Show fewer":"Show "+leftover+" earlier")+'</button>';
    h+='</div>';
  } else if(!names.length && r.kind!=="agent"){h+='<div data-sec="note"><p class="note">No activity recorded yet.</p></div>';}
  return h;
}

var CLS_WORD={shell:"Running",python:"Running Python",read:"Reading",edit:"Editing",web:"On the web",mcp:"Using",delegate:"Delegating",other:"Using"};
function actPose(u){var a=u.activity;if(u.state!=="running"||!a)return u.state;return a.state==="thinking"?"thinking":a.state==="waiting"?"waiting":"running";}
function actLine(u){var a=u.activity;if(u.state!=="running"||!a||a.state==="done")return "";
  // "Asking the model, 30s" / "Waiting 3m": the clock is a tick span, not a baked number
  var since=a.since?tickSpan(a.since,"dur"):"";
  if(a.state==="thinking")return '<div class="act"><span class="k think">Thinking</span><span class="v">Asking the model'+(since?", "+since:"")+'</span></div>';
  var tgt=a.target?'<code>'+esc(a.target)+'</code>':esc(a.tool||"");
  var verb=a.cls==="python"&&/pytest/.test(a.target||"")?"Running tests":(a.cls==="mcp"||a.cls==="other"?"Using "+esc(a.tool||""):CLS_WORD[a.cls]||esc(a.tool||""));
  if(a.state==="waiting")return '<div class="act"><span class="k wait">Waiting '+since+'</span><span class="v">'+tgt+'</span></div>';
  return '<div class="act"><span class="k tool">'+verb+'</span><span class="v">'+tgt+'</span></div>';}
function callsHtml(key,u){var a=u.activity;if(!a||!a.calls||!a.calls.length)return "";
  var split=(a.thinking_s!=null?"thinking "+dur(a.thinking_s):"")+(a.tools_s!=null?", tools "+dur(a.tools_s):"");
  return '<details class="calls" data-key="'+esc(key)+'"'+(openFin[key]?" open":"")+'><summary data-fk="calls:'+esc(key)+'">'+(a.calls.length===1?"Last tool call":"Last "+a.calls.length+" tool calls")+(split?' <small>'+esc(split)+'</small>':"")+'</summary><ol>'+
    a.calls.slice().reverse().map(function(c){return '<li class="'+(c.ok===false?"bad":"")+'"><span class="ct">'+esc(c.tool)+'</span><code title="'+esc(c.target||"")+'">'+esc(c.target||"")+'</code><span class="tm">'+(c.abandoned?"no reply":c.ok===false?"failed, "+dur(c.seconds):dur(c.seconds))+'</span></li>';}).join("")+'</ol></details>';}
function kTok(x){return x>=1024?Math.round(x/1024)+"k":String(x);}  /* binary k: 524288 tokens is the 512k window */
function ctxHtml(a){if(!a||!a.ctx||!a.win)return "";var p=a.ctx/a.win,hot=p>=0.8;
  return '<div class="ctx'+(hot?" hot":"")+'"><span>Context</span><div class="cbar"><i style="width:'+pct(p)+'%"></i></div><span>'+kTok(a.ctx)+' / '+kTok(a.win)+'</span></div>';}
function tileHtml(n,u,rid){var now=Date.now()/1000,secs=u.state==="running"&&u.started?(now-u.started):u.seconds;
  // a unit still "running" past its own timeout is stuck: say so in the warn ink
  var over=u.state==="running"&&u.started&&u.timeout&&(now-u.started)>u.timeout;
  var timeTxt=u.state==="running"&&u.started?tickSpan(u.started,"dur"):dur(secs);
  var t=u.state==="queued"?"waiting for a seat":(over?timeTxt+", over its "+dur(u.timeout)+" limit":timeTxt+(u.timeout?" / "+dur(u.timeout):""));
  return '<div class="tile'+(u.state==="queued"?" quiet":"")+'">'+robot(famOf(u.role),actPose(u))+
    '<b title="'+esc(n)+'">'+esc(n)+'</b><span class="role">'+esc(u.role)+'</span>'+
    bar(u.progress||0,u.progress>0.85?"hot":"")+'<div class="meta"><span>'+esc(u.state==="queued"?"":STATE_WORD[u.state])+'</span>'+
    (over?'<span class="over">'+t+'</span>':'<span>'+t+'</span>')+'</div>'+
    actLine(u)+(u.state==='running'?ctxHtml(u.activity):'')+callsHtml((rid||"")+":c:"+n,u)+'</div>';}
/* One agent's row. A unit_done that said ok:false is a FAILED unit even though its state
   is "done" (the fold keeps both): the check goes red and the word is "failed".
   stt is the state the phase presents it under -- a dead run's rows read "not run". */
function rowHtml(n,u,stt){var s=stt||u.state;
  var bad=u.ok===false||s==="dropped"||s==="not run";
  var mk=bad?'<span class="mark bad" role="img" aria-label="'+(u.ok===false?"failed":s==="dropped"?"dropped":"did not run")+'">!</span>':
    '<span class="mark ok" role="img" aria-label="finished">✓</span>';
  var word=u.ok===false?"failed":(STATE_WORD[s]||s);
  return '<li>'+mk+'<span class="nm">'+esc(n)+' <small>'+esc(u.role)+'</small></span><span class="tm">'+esc(word+(u.seconds!=null?", "+dur(u.seconds):""))+'</span>'+
    (u.why?'<span class="why">'+esc(u.why)+'</span>':"")+'</li>';}
/* Whether a phase group is open: the user's own choice for it wins (null = none made,
   so the default rules); by default a finished phase is collapsed to its summary line
   and every other one -- the running phase above all -- stays expanded. */
function phaseOpen(choice,finished){return typeof choice==="boolean"?choice:!finished;}
function wave(w,r,us,o){
  var p=w.p,label=esc(p.label||("Phase "+(w.i+1)));
  if(w.planned){
    // a phase still to come has no agents to show, so nothing to toggle: its name and,
    // when the outline knew it, its size -- or, once the run is over, that it never
    // ran; a phase the workflow jumped over says so even while the run is live
    var size=p.n!=null?cnt(p.n,"agent"):"";
    var note=w.skipped?(size?size+", Skipped":"Skipped"):
      o==="running"?(size?size+", not started":"Not started"):"Did not run";
    return '<div class="wave planned" data-sec="wave:'+esc(w.key)+'"><div class="ph-head"><span class="mark gone" aria-hidden="true"></span><span class="wl">'+label+'</span><small>'+note+'</small></div></div>';
  }
  // a run that ended, failed or was killed has no live units any more: whatever the
  // fold last saw mid-flight never got its turn. Show it as not run -- rows, not
  // spinning tiles -- or a dead run keeps the whole page looking alive.
  var liveRun=o==="running";
  var list=w.list;
  function eff(n){var s=us[n].state;return s==="running"||s==="queued"?(liveRun?s:"not run"):s;}
  var act=liveRun?list.filter(function(n){return us[n].state==="running"||us[n].state==="queued";}):[];
  var fin=list.filter(function(n){return act.indexOf(n)<0;});
  var drop=fin.filter(function(n){var s=eff(n);return s==="dropped"||s==="not run";}).length;
  // only done and cached count as done; a unit_done that said ok:false is a failure
  var failN=fin.filter(function(n){return us[n].ok===false;}).length;
  var doneN=fin.filter(function(n){var s=eff(n);return (s==="done"||s==="cached")&&us[n].ok!==false;}).length;
  var finished=!liveRun||p.end!=null&&!act.length;
  var key=w.key, open=phaseOpen(phaseChoice(key),finished), bid="ph-"+(w.i+1);
  var info=[];
  if(finished){info.push(list.length+(list.length===1?" agent":" agents"));
    if(p.wall!=null)info.push("took "+dur(p.wall));
    if(p.usage!=null)info.push(p.usage>=1?"kept all seats busy":"seats busy "+pct(p.usage)+"% of the time");
    if(drop)info.push(drop+" dropped");
    if(failN)info.push(failN+" failed");}
  else if(!w.loose){info.push(doneN+" of "+(p.n||list.length)+" done");
    var rest=fin.length-doneN-failN;
    if(rest)info.push(rest+" did not run");
    if(failN)info.push(failN+" failed");
    var nb=act.filter(function(n){return us[n].state==="running";}).length;
    if(nb)info.push(nb+" working");if(act.length-nb)info.push((act.length-nb)+" waiting");}
  var st=finished?(drop||failN?'<span class="mark bad" role="img" aria-label="'+(failN?"failed":"finished with drops")+'">!</span>':
    '<span class="mark ok" role="img" aria-label="finished">✓</span>'):
    (w.loose?'<span class="mark gone">·</span>':'<span class="spin" role="img" aria-label="running"></span>');
  var live=!finished&&!w.loose&&act.length>0;
  var h='<section class="wave'+(finished?" finished":"")+(live?" live":"")+'" data-sec="wave:'+esc(key)+'"><button type="button" class="ph-head" data-ph="'+esc(key)+'" data-fk="ph:'+esc(key)+'" aria-expanded="'+open+'" aria-controls="'+bid+'">'+st+'<span class="wl">'+label+'</span><small>'+esc(info.join(", "))+'</small><span class="chev" aria-hidden="true"></span></button><div class="wbody" id="'+bid+'"'+(open?"":" hidden")+'>';
  var busy=act.filter(function(n){return us[n].state==="running";}),queued=act.filter(function(n){return us[n].state==="queued";});
  // two hundred working robots is not information, it is 200 animations and a 37,000 px
  // page: twelve tiles carry the shape of the phase, the button opens the rest (the
  // choice kept like the feed's), and the sleepers count out past the twenty-fourth
  var tilesMore="";
  if(busy.length>TILE_SHOW){
    var tOpen=!!feedAll["tiles:"+key];
    tilesMore='<button type="button" class="more" data-more="tiles:'+esc(key)+'" data-fk="tiles:'+esc(key)+'" aria-expanded="'+tOpen+'">'+(tOpen?"Show fewer":"Show all "+busy.length+" working")+'</button>';
    if(!tOpen) busy=busy.slice(0,TILE_SHOW);}
  if(busy.length) h+='<div class="tiles">'+busy.map(function(n){return tileHtml(n,us[n],r.id);}).join("")+'</div>'+tilesMore;
  if(queued.length) h+='<div class="queue"><p>'+esc(queued.length+" waiting for a seat")+'</p><ul>'+

    var lt=h.lastIndexOf("<",m.index),gt=h.indexOf(">",m.index);
    if(lt<0||gt<0||h.charAt(gt-1)==="/")return null;             /* only whole elements */
    var nm=h.slice(lt+1).match(/^[a-zA-Z][^\s>/]*/);if(!nm)return null;
    var end=secEnd(h,gt+1,nm[0].toLowerCase());if(end<0)return null;
    map[m[1]]=h.slice(lt,end);list.push({k:m[1],html:map[m[1]]});
    re.lastIndex=end;}                                           /* sections do not nest */
  return {map:map,list:list};}
function sameOrder(a,b){if(!a||!b||a.list.length!==b.list.length)return false;
  for(var i=0;i<a.list.length;i++)if(a.list[i].k!==b.list[i].k)return false;return true;}
function swap(html){if(!app||html===lastHtml)return;
  var secs=null;try{secs=splitSecs(html);}catch(e){secs=null;}
  var crew=app.querySelector(".crew"),sc=crew?crew.scrollLeft:0;
  var part=!!secs&&sameOrder(secs,lastSecs);
  if(part)for(var i=0;i<secs.list.length;i++){var s=secs.list[i];
    if(lastSecs.map[s.k]===s.html)continue;
    var els=app.querySelectorAll("[data-sec]"),el=null;
    for(var j=0;j<els.length;j++)if(els[j].getAttribute("data-sec")===s.k){el=els[j];break;}
    if(!el){part=false;break;}
    el.outerHTML=s.html;}
  if(!part)app.innerHTML=html;
  lastHtml=html;lastSecs=secs;
  var c2=app.querySelector(".crew");if(c2)c2.scrollLeft=sc;
  tickAll();}
function render(){
  var id=location.hash.slice(1);
  var url=id?"/api/run/"+encodeURIComponent(id):"/api/runs";
  fetch(url,{cache:"no-store"}).then(function(res){
    if(res.status===404) return {missing:true};
    return res.json();
  }).then(function(d){
    if(failSince){srSay("Viewer back.");}
    failSince=0;fails=0;htmlClass("offline",false);
    lastOk=Date.now();
    checkPageVersion(d);
    var fk=focusKey();
    if(id){ if(d.missing) swap(topbar(0)+'<div data-sec="back"><a class="back" href="#" data-fk="back">← All runs</a></div><div data-sec="gone"><p class="note">This run is no longer on the page. Finished runs leave after a while.</p></div>');
      else { swap(topbar(outcome(d)==="running")+detail(d)); document.title=titleFor(d); }
      srCheck(d); }
    else { var runs=Array.isArray(d)?d:(d&&d.runs); var live=runs.filter(function(r){return outcome(r)==="running";}).length;
      swap(topbar(live)+overview(runs));
      document.title=(live?live+" running, ":"")+"qwen watch"; }
    refocus(fk);
  }).catch(function(){
    if(!failSince){failSince=Date.now()/1000;srSay("Lost the viewer.");}
    fails++;
    htmlClass("offline",true);
    lastHtml="";lastSecs=null;   // the DOM now carries the banner, not the last good page
    if(!app.innerHTML) app.innerHTML=topbar(0)+'<p class="note">Can’t reach the viewer. It may have been stopped; the next local agent run starts it again.</p>';
    else { var t=app.querySelector('[data-sec="top"]'); if(t) t.outerHTML=topbar(0)+(fails>=2?offlineHtml(failSince):""); }
  });
}
window.addEventListener("hashchange",function(){window.scrollTo(0,0);render();});
// the stored pause choice takes effect before the first frame, not after a moving one
applyStill();
render(); setInterval(render,2500); setInterval(tickAll,1000);
</script>
